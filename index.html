<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="weather-container">
            <div class="temp">
                <p>20°C</p>
            </div>

            <div class="time_location">
                <p class="location">Delhi</p>
                <p class="date">12:58 - Monday 2022-09-26</p>
            </div>

            <div class="condition">
                <p>mist</p>
            </div>
        </div>

        <nav>
            <form>
                <input type="text" placeholder="Search for a location" class="search-area" />
                <button type="submit">Search</button>
            </form>
        </nav>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
